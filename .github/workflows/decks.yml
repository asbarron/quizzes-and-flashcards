name: Decks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Validate flashcards and quizzes
        run: python3 tools/validate.py

      - name: Build Anki packages
        run: python3 tools/build_anki.py build

      - name: Move the latest tag to this commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish latest decks
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest decks
          body: Anki packages built from the newest flashcards and quizzes. Open a .apkg file in Anki (File > Import).
          artifacts: build/*.apkg
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: build/*.apkg
          allowUpdates: true
          generateReleaseNotes: true
          makeLatest: false
